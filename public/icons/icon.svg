<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Lilac app icon: the cycle dial (lilac→rose ring with today's pearl) around the brand sparkle.
       Full-bleed square: iOS and Android round the corners themselves. Everything important sits
       inside the central 80% so it also works as an Android "maskable" icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCC8FF"/>
      <stop offset="0.55" stop-color="#EBCDF5"/>
      <stop offset="1" stop-color="#FFC9DD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7552D6"/>
      <stop offset="0.5" stop-color="#B85CC0"/>
      <stop offset="1" stop-color="#E8588E"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E25A90"/>
      <stop offset="1" stop-color="#A82E5E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A1840" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Dial: soft track, then the cycle so far (starting at the top, going clockwise) -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="96"/>
  <path d="M512 212 A300 300 0 1 1 409.4 793.9" fill="none" stroke="url(#ring)" stroke-width="96" stroke-linecap="round" filter="url(#soft)"/>

  <!-- Today's pearl at the end of the ring -->
  <g filter="url(#soft)">
    <circle cx="409.4" cy="793.9" r="64" fill="#FFFFFF"/>
    <circle cx="409.4" cy="793.9" r="64" fill="none" stroke="#5B3BB0" stroke-width="22"/>
    <circle cx="409.4" cy="793.9" r="20" fill="#5B3BB0"/>
  </g>

  <!-- Brand sparkle in the centre -->
  <g transform="translate(320 352) scale(16)" fill="url(#spark)">
    <path d="M12 3c.6 4.3 2.7 6.4 7 7-4.3.6-6.4 2.7-7 7-.6-4.3-2.7-6.4-7-7 4.3-.6 6.4-2.7 7-7z"/>
    <path d="M19 15.5c.2 1.4.9 2.1 2.3 2.3-1.4.2-2.1.9-2.3 2.3-.2-1.4-.9-2.1-2.3-2.3 1.4-.2 2.1-.9 2.3-2.3z"/>
  </g>
</svg>
